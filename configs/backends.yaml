# Backend aliases used on the command line as  <provider>:<alias>   e.g.  openrouter:claude
# A raw model id can always be passed as  <provider>:model=<id>.
#
# The manuscript's original backends were Claude-3.5-Sonnet, GPT-4o-Latest and Gemini-1.5-Pro.
# Rolling aliases (chatgpt-4o-latest) and retired snapshots are not reproducible; the runner
# records both the requested id and the id returned by the provider in the run manifest.
# Catalog check (2026-09-03): OpenRouter no longer lists claude-3.5-sonnet, chatgpt-4o-latest or
# gemini-1.5-pro; dated snapshots below are the closest available replacements. Edit as needed.
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  poe:
    base_url: https://api.poe.com/v1
    api_key_env: POE_API_KEY
  minimax:
    base_url: https://api.minimax.io/v1
    api_key_env: MINIMAX_API_KEY
  minimax-cn:
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
backends:
  claude:
    family: anthropic
    paper_model: "Claude-3.5-Sonnet (claude-3-5-sonnet-20241022)"
    models:
      openrouter: anthropic/claude-sonnet-4.6
      poe: claude-sonnet-4.6
      anthropic: claude-3-5-sonnet-20241022
  gpt4o:
    family: openai
    paper_model: "GPT-4o-Latest (chatgpt-4o-latest, rolling alias)"
    models:
      openrouter: openai/gpt-4o-2024-11-20
      poe: gpt-4o
      openai: gpt-4o-2024-11-20
  gemini:
    family: google
    paper_model: "Gemini-1.5-Pro (gemini-1.5-pro-002)"
    models:
      openrouter: google/gemini-2.5-pro
      poe: gemini-2.5-pro
  minimax:
    family: minimax
    paper_model: "not used in the original submission (additional open-weight backend)"
    models:
      openrouter: minimax/minimax-m2.5
      poe: minimax-m2.5
      minimax: MiniMax-M2.5
      minimax-cn: MiniMax-M2.5
